<section class="modulex-cagri-bilet-sirasi{{fbsinif}}" {{fbetiket}}>

<style>
  /* cagri-bilet-sirasi — cagri-bilet etkinlik koçanı, cagri-takip-no kargo etiketidir; bu modül bekleme salonu metaforuyla (sıra numarası ekranı + yazıcıdan çıkan fiş, görününce kayma hareketi) «sırada beklemeden online işlem» çağrısı yapar — ailede cihaz/fiş çıkışı iskeleti yok. */
  .modulex-cagri-bilet-sirasi { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --yaziRenk--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-cagri-bilet-sirasi *, .modulex-cagri-bilet-sirasi *::before, .modulex-cagri-bilet-sirasi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-cagri-bilet-sirasi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-cagri-bilet-sirasi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-cagri-bilet-sirasi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-cagri-bilet-sirasi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-cagri-bilet-sirasi img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-cagri-bilet-sirasi) img { height: auto; }
  .modulex-cagri-bilet-sirasi [hidden] { display: none !important; }
  .modulex-cagri-bilet-sirasi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-cagri-bilet-sirasi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-cagri-bilet-sirasi-ic { max-width: --max--; margin-inline: auto; }
  .modulex-cagri-bilet-sirasi-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-cagri-bilet-sirasi--bassiz .modulex-cagri-bilet-sirasi-bas { display: none; }
  .modulex-cagri-bilet-sirasi-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-cagri-bilet-sirasi-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-cagri-bilet-sirasi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-cagri-bilet-sirasi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-cagri-bilet-sirasi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-cagri-bilet-sirasi-dugme:hover { transform: translateY(-2px); }
  .modulex-cagri-bilet-sirasi-dugme--ikincil { background: transparent; color: --yaziRenk--; border-color: --cizgi--; }
  .modulex-cagri-bilet-sirasi-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-cagri-bilet-sirasi-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-cagri-bilet-sirasi-duzen { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(32px, 6vw, 80px); align-items: center; }
  .modulex-cagri-bilet-sirasi-duzen--tek { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
  .modulex-cagri-bilet-sirasi-makine { justify-self: center; display: grid; width: min(100%, 320px); padding: 18px 18px 0; border: 1px solid --cizgi--; border-radius: 28px 28px 10px 10px; background: --kartBg--; box-shadow: 0 30px 60px -40px color-mix(in srgb, --yaziRenk-- 70%, transparent); }
  .modulex-cagri-bilet-sirasi-ekran2 { display: grid; gap: 6px; padding: 18px; border-radius: 14px; background: --yaziRenk--; color: --bg--; text-align: center; }
  .modulex-cagri-bilet-sirasi-ead { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-cagri-bilet-sirasi-led { color: color-mix(in srgb, --accent-- 45%, --bg--); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: clamp(2.6rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: 0.08em; line-height: 1; font-variant-numeric: tabular-nums; animation: modulex-cagri-bilet-sirasi-yan 2.4s ease-in-out infinite; }
  .modulex-cagri-bilet-sirasi-yuva { position: relative; overflow: hidden; margin-inline: 8px; padding-block: 14px 0; }
  .modulex-cagri-bilet-sirasi-yuva::before { content: ""; display: block; height: 10px; border-radius: 999px; background: color-mix(in srgb, --yaziRenk-- 70%, --kartBg--); }
  .modulex-cagri-bilet-sirasi-fis { display: grid; justify-items: center; gap: 10px; margin-inline: 14px; padding: 18px 14px 22px; border: 1px solid --cizgi--; border-block-start: 0; background: --bg--; text-align: center; transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-cagri-bilet-sirasi--hazir:not(.modulex-cagri-bilet-sirasi--gor) .modulex-cagri-bilet-sirasi-fis { transform: translateY(-105%); }
  .modulex-cagri-bilet-sirasi-fust { color: --accentInk--; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-cagri-bilet-sirasi-barkod { width: 80%; height: 34px; background: repeating-linear-gradient(90deg, --yaziRenk-- 0 2px, transparent 2px 5px, --yaziRenk-- 5px 6px, transparent 6px 9px); }
  .modulex-cagri-bilet-sirasi-fbek { display: flex; align-items: center; gap: 6px; color: --muted--; font-size: 0.9rem; }
  .modulex-cagri-bilet-sirasi-bikon { color: --accentInk--; font-size: 18px; }
  .modulex-cagri-bilet-sirasi-yazi { display: grid; gap: 14px; justify-items: start; }
  .modulex-cagri-bilet-sirasi-ptel { color: --yaziRenk--; font-size: 1.3rem; font-weight: 800; text-decoration: none; font-variant-numeric: tabular-nums; transition: color 0.25s ease; }
  .modulex-cagri-bilet-sirasi-ptel:hover { color: --accentInk--; }
  @keyframes modulex-cagri-bilet-sirasi-yan { 50% { text-shadow: 0 0 18px color-mix(in srgb, --accent-- 60%, transparent); } }
  @media (max-width: 768px) {
    .modulex-cagri-bilet-sirasi-duzen { grid-template-columns: minmax(0, 1fr); }
  }
  .modulex-cagri-bilet-sirasi-wasvg { width: 1.25em; height: 1.25em; flex: none; }
  .modulex-cagri-bilet-sirasi-maddeler { display: grid; gap: 12px; }
  .modulex-cagri-bilet-sirasi-madde { display: flex; align-items: flex-start; gap: 12px; }
  .modulex-cagri-bilet-sirasi-mikon { flex: none; color: --accentInk--; font-size: 24px; }
  .modulex-cagri-bilet-sirasi-myazi { display: grid; gap: 2px; }
  .modulex-cagri-bilet-sirasi-myazi strong { font-weight: 700; }
  .modulex-cagri-bilet-sirasi-myazi small { color: --muted--; font-size: 0.92rem; }
  .modulex-cagri-bilet-sirasi-not { color: --muted--; font-size: 0.9rem; }
  .modulex-cagri-bilet-sirasi-saat { display: flex; align-items: center; gap: 8px; color: --muted--; font-size: 0.95rem; }
  .modulex-cagri-bilet-sirasi-saat .material-symbols-outlined { font-size: 20px; color: --accentInk--; }
  .modulex-cagri-bilet-sirasi-metin { max-width: 62ch; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-bilet-sirasi :is(.modulex-cagri-bilet-sirasi-baslik, .modulex-cagri-bilet-sirasi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-bilet-sirasi-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-cagri-bilet-sirasi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-cagri-bilet-sirasi *, .modulex-cagri-bilet-sirasi *::before, .modulex-cagri-bilet-sirasi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-cagri-bilet-sirasi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
