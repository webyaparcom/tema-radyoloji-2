    .modulex-iletisim-birim-rehber-br-gh { position: static; justify-self: start; inline-size: 48px; block-size: 48px; border-radius: 12px; font-size: 1.4rem; }
  }

  .modulex-iletisim-birim-rehber-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-birim-rehber-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }

  .modulex-iletisim-birim-rehber--kjs .modulex-iletisim-birim-rehber-kopya { display: inline-flex; }

  .modulex-iletisim-birim-rehber-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-birim-rehber-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }

  .modulex-iletisim-birim-rehber-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-birim-rehber-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-birim-rehber-zipla 2.4s ease-in-out infinite; }

  .modulex-iletisim-birim-rehber-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-birim-rehber-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-birim-rehber :is(.modulex-iletisim-birim-rehber-baslik, .modulex-iletisim-birim-rehber-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-birim-rehber-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-birim-rehber { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-birim-rehber *, .modulex-iletisim-birim-rehber *::before, .modulex-iletisim-birim-rehber *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-birim-rehber";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const birimSuz = (s, P) => {
        const H = [...s.querySelectorAll("[data-harf]")];
        const G = [...s.querySelectorAll("[data-harf-grup]")];
        if (H.length < 3 || G.length < 2) return;
        s.classList.add(P + "--hjs");
        const sec = (h) => {
          H.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.harf === h)));
          G.forEach((g) => { g.hidden = !!h && g.dataset.harfGrup !== h; });
        };
        H.forEach((b) => {
          b.hidden = false;
          if (b.tagName === "A") b.setAttribute("role", "button");
          b.addEventListener("click", (e) => {
            e.preventDefault();
            sec(b.dataset.harf && b.getAttribute("aria-pressed") === "true" ? "" : b.dataset.harf);
          });
        });
        sec("");
      };
    const kopyala = (s, P) => {
        if (!navigator.clipboard || !navigator.clipboard.writeText) return;
        s.classList.add(P + "--kjs");
        s.querySelectorAll("[data-kopyala]").forEach((b) => {
          const yazi = b.querySelector("." + P + "-kyazi");
          const ilk = yazi ? yazi.textContent : "";
          b.addEventListener("click", () => {
            const bitti = () => {
              b.classList.add(P + "--kopyalandi");
              if (yazi) yazi.textContent = b.dataset.tamam || ilk;
              setTimeout(() => { b.classList.remove(P + "--kopyalandi"); if (yazi) yazi.textContent = ilk; }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.kopyala).then(bitti, () => {});
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      birimSuz(s, P, az);
      kopyala(s, P, az);
    });
  })();
</script>
